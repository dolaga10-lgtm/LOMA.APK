name: Build Smart Workshop Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: استخراج وبناء ملف تطبيق الأندرويد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle Wrapper & Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r lib /tmp/lib_backup
          mkdir -p /tmp/custom_icons
          cp -r android/app/src/main/res/mipmap-* /tmp/custom_icons/ 2>/dev/null || true
          flutter create . --project-name smart_workshop --org com.smartworkshop --platforms android
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          cp -r /tmp/lib_backup/* lib/
          cp -r /tmp/custom_icons/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          if [ -f android_manifest_custom.xml ]; then
            cp android_manifest_custom.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f main_activity_custom.kt ]; then
            MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
            if [ -n "$MAIN_KT" ]; then
              cp main_activity_custom.kt "$MAIN_KT"
            else
              mkdir -p android/app/src/main/kotlin/com/smartworkshop/smart_workshop
              cp main_activity_custom.kt android/app/src/main/kotlin/com/smartworkshop/smart_workshop/MainActivity.kt
            fi
          fi
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              val forceCompileSdk: Project.() -> Unit = {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      val m = ext.javaClass.methods.firstOrNull { it.name == "setCompileSdk" && it.parameterCount == 1 }
                          ?: ext.javaClass.methods.firstOrNull { it.name == "compileSdkVersion" && it.parameterCount == 1 && it.parameterTypes[0] == Int::class.javaPrimitiveType }
                      m?.invoke(ext, 36)
                  }
              }
              if (state.executed) forceCompileSdk() else afterEvaluate { forceCompileSdk() }
          }
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Hafez_Smart_Workshop_Release.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hafez-Smart-Workshop-APK
          path: Hafez_Smart_Workshop_Release.apk

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: "إصدار تطبيق حافظ سمارت والورشة الذكية v5.0.${{ github.run_number }}"
          body: |
            ### نسخة تطبيق شركة الحافظ (الورشة الذكية وتقسيم الأعواد وعروض الأسعار)
            - مطابقة كاملة للورشة الذكية وتقسيم الأعواد مع جميع القطاعات وصورها وروابط الكتالوجات.
            - اختيار سريع (منزلق / مفصلي) وشاشة معاينة حية مثبتة بالأعلى مع جميع خيارات الثوابت (شمال، يمين، فوق، تحت) والشفاط.
            - قائمة تسعير شاملة لكل القطاعات والزجاج والإكسسوارات.
            - استخراج PDF عرض السعر مطابق تماماً لتصميم شركة الحافظ المعتمد + PDF حساب الطلبية وتقطيع الأعواد.
            - حفظ الـ PDF مع فتح مدير الملفات لاختيار مكان الحفظ مباشرة.
          files: Hafez_Smart_Workshop_Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
