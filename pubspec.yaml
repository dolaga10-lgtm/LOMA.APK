name: smart_workshop
description: شركة الحافظ للمطابخ الألومنيوم والخشب وجميع أعمال الأخشاب والواجهات الزجاجية - الورشة الذكية
publish_to: 'none'
version: 5.0.0+130

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0
  http: ^1.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/catalogues/
    - assets/images/catalogues/colors_catalogues/
    - assets/images/home_icon/
    - assets/images/home_icon/client_icon/
    - assets/images/other/
    - assets/images/svg/
    - assets/images/svg/kitchen/
    - assets/images/svg/kitchen/handle/
    - assets/images/svg/kitchen/sash/
    - assets/images/svg/kitchen/sk/
    - assets/images/svg/profiles/
    - assets/images/svg/profiles/AluMil/
    - assets/images/svg/profiles/AluMil/M12000/
    - assets/images/svg/profiles/AluMil/M900/
    - assets/images/svg/profiles/AluMil/M9200/
    - assets/images/svg/profiles/AluMil/M940/
    - assets/images/svg/profiles/AluMil/M9400/
    - assets/images/svg/profiles/AluMil/all/
    - assets/images/svg/profiles/Volcano/
    - assets/images/svg/profiles/Volcano/V120/
    - assets/images/svg/profiles/Volcano/V44/
    - assets/images/svg/profiles/Volcano/V70/
    - assets/images/svg/profiles/Volcano/all/
    - assets/images/svg/profiles/maxim/
    - assets/images/svg/profiles/maxim/all/
    - assets/images/svg/profiles/maxim/e105/
    - assets/images/svg/profiles/maxim/e37/
    - assets/images/svg/profiles/maxim/e47/
    - assets/images/svg/profiles/maxim/e777/
    - assets/images/svg/profiles/ps/
    - assets/images/svg/profiles/ps/4800/
    - assets/images/svg/profiles/ps/5600/
    - assets/images/svg/profiles/ps/6600/
    - assets/images/svg/profiles/ps/9600/
    - assets/images/svg/profiles/ps/all/
