    - assets/images/svg/profiles/sh/JamBo100/
    - assets/images/svg/profiles/sh/Nano50/
    - assets/images/svg/profiles/sh/Sonata45/
    - assets/images/svg/profiles/sh/Tango60/
    - assets/images/svg/profiles/sh/TemBo84/
