    - assets/images/windows/slide/
    - assets/images/windows/systems/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: Hacen
      fonts:
        - asset: assets/fonts/Hacen_Tunisia.ttf
